<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="FfCz8KjEj2a375e0CGoWma3BfA298PttSlMrlrthRC0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Evolution Lab</title>
    <!-- Google Fonts: solo las 2 familias usadas en toda la app (Orbitron, Inter).
         Las 6 familias del branding personalizado del entrenador se cargan
         bajo demanda vía src/lib/dynamicFonts.ts, solo donde hacen falta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Splash de arranque: transparente sobre el fondo de la app. Compartido con
         src/components/common/BootSplash.tsx para que no haya salto visual cuando
         React reemplaza este contenido. -->
    <style>
      .evolab-boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        color: #fff;
        font-family: 'Orbitron', sans-serif;
      }
      .evolab-boot__spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.08);
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: evolab-boot-spin 1s linear infinite;
        margin-bottom: 15px;
      }
      .evolab-boot__label {
        font-size: 11px;
        letter-spacing: 2px;
        opacity: 0.8;
        text-transform: uppercase;
      }
      @keyframes evolab-boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <!-- Polyfill temprano para navegadores in-app de iOS (Instagram/Facebook/TikTok)
         evita TypeErrors por window.webkit.messageHandlers antes de que cargue cualquier bundle -->
    <script>
      try {
        if (!window.webkit) window.webkit = {};
        if (!window.webkit.messageHandlers) {
          window.webkit.messageHandlers = new Proxy({}, {
            get: function () { return { postMessage: function () {} }; }
          });
        }
      } catch (e) {}
    </script>
    <!-- Red de seguridad contra pantalla en blanco permanente. Script clásico a propósito:
         debe correr aunque el bundle principal falle. Ver public/boot-guard.js -->
    <script src="/boot-guard.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="evolab-boot" role="status" aria-live="polite">
        <div class="evolab-boot__spinner"></div>
        <span class="evolab-boot__label">Cargando Evolution Lab...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
