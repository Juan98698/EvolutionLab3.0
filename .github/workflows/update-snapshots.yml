name: Actualizar Snapshots de Regresión Visual

# Se activa SOLO de forma manual desde la pestaña "Actions" del repo.
# Úsalo cuando hagas cambios de UI intencionales y necesites regenerar
# las imágenes baseline para que el CI vuelva a pasar.
on:
  workflow_dispatch:

jobs:
  update-snapshots:
    name: Regenerar baselines con Playwright y commitear
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    # Misma imagen que usa el CI normal → renderizado idéntico (fuentes, antialiasing).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host

    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key

    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          # Se necesita un token con permiso de push para que el commit automático funcione.
          # Usa el token por defecto del workflow (GITHUB_TOKEN) — ya tiene permiso
          # de escritura sobre el repo si está configurado en Settings → Actions → General
          # → Workflow permissions → "Read and write permissions".
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar snapshots
        run: npx playwright test e2e/visual-regression.spec.ts --project=chromium --update-snapshots=all --reporter=list

      - name: Configurar Git
        # Dentro del contenedor el repo pertenece a otro usuario y Git lo rechaza
        # por "dubious ownership" (se ve como "fatal: not in a git directory").
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commitear nuevos baselines
        run: |
          git add e2e/visual-regression.spec.ts-snapshots/
          # Si no hay cambios (nada nuevo) el commit falla suavemente
          # GITHUB_TOKEN no dispara otro workflow con su push. Tras revisar las
          # imágenes, ejecutar manualmente CI sobre el commit nuevo antes de integrarlo.
          git diff --cached --quiet && echo "Sin cambios en snapshots." || \
            git commit -m "ci: actualizar snapshots de regresión visual"

      - name: Pushear al branch actual
        run: git push
