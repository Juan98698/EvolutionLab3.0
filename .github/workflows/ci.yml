name: CI

# Validación automática en main y sus pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lanzamiento manual desde Actions → CI → Run workflow (por ejemplo, para
  # validar una rama después de que el bot de capturas haga su commit).
  workflow_dispatch:

jobs:
  build-and-test:
    name: TypeScript + Lint + Tests
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key

    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        run: npm audit --audit-level=low

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint, 0 warnings permitidos)
        run: npm run lint

      - name: Tests unitarios (Vitest)
        # `npm test` por defecto entra en watch mode — en CI hay que forzar
        # `run` para que ejecute una vez y termine con exit code.
        run: npm run test:run

      - name: Build de producción
        run: npm run build

  e2e:
    name: E2E + Regresión Visual (Playwright)
    runs-on: ubuntu-24.04
    needs: build-and-test

    # La imagen coincide con la versión fijada en package-lock.json.
    # Las referencias Linux se generan con esta misma imagen; Windows usa su propia carpeta.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host

    env:
      # El build de rendimiento usa el cliente real, con destino ficticio.
      # Las pruebas E2E usan el adaptador exclusivo de e2e/support.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-public-anon-key

    steps:
      - name: Checkout código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Instalar dependencias
        run: npm ci

      - name: Tests E2E y regresión visual (Playwright)
        run: npx playwright test

      - name: Compilar para medir rendimiento
        run: npm run build

      - name: Rendimiento de la portada en móvil
        run: npm run test:performance

      - name: Subir evidencia si falla (screenshots/traces)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: playwright-test-results
          path: |
            test-results/
            performance-results/
          retention-days: 7
